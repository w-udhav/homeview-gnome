[workspace]
resolver = "2"
members = [
    "crates/hv-core",
    "crates/hv-collectors",
    "crates/hv-daemon",
    "crates/hv-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "signal"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = "thin"
strip = true
